[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = -ra
markers =
    auth: Pruebas de autenticación y permisos.
    robustness: Pruebas de caja negra (PE/AVL) contra entradas maliciosas.
    fsm: Pruebas de flujo de estados.
    logic: Pruebas de lógica de negocio y servicios.
